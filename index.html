<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#121518"><title>Apartment preview · work in progress</title>
  <link rel="stylesheet" href="./style.css?v=mobile-v1">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/","@sparkjsdev/spark":"./vendor/spark.module.js"}}</script>
</head>
<body>
  <main id="viewport" aria-label="Interactive apartment walkthrough"></main>
  <header><div><h1 id="title">Apartment preview</h1><p id="model-info">Living room &amp; bedroom</p></div><nav aria-label="View controls"><div id="rooms"></div><button id="reset">Reset</button><button id="fullscreen">Fullscreen</button></nav></header>
  <section id="status" role="status" aria-live="polite"><h2 id="status-title">Opening the apartment</h2><p id="status-detail">This can take a moment.</p><progress id="progress" hidden max="100"></progress><button id="start-tour" type="button" hidden>Start tour</button><button id="retry" type="button" hidden>Back to start</button></section>
  <div id="touch-controls" aria-label="Walking controls" hidden><button data-move="KeyW" aria-label="Walk forward">↑</button><button data-move="KeyA" aria-label="Walk left">←</button><button data-move="KeyS" aria-label="Walk backward">↓</button><button data-move="KeyD" aria-label="Walk right">→</button></div><footer><span id="instructions">Drag to look · Double-click to lock mouse · WASD move · Shift faster · R reset</span><span id="fps">Idle</span></footer>
  <script type="module" src="./app.js?v=mobile-v1"></script>
</body>
</html>
